name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm' # Отключено, так как требует package-lock.json

      - name: Install dependencies
        run: npm install # Используем install вместо ci, чтобы работать без package-lock.json

      - name: Build
        run: npm run build
        env:
          # Если вы используете секреты в репозитории, раскомментируйте строки ниже:
          # VITE_API_KEY: ${{ secrets.API_KEY }}
          # VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CI: false

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
